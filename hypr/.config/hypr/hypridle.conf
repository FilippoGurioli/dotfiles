general {
    lock_cmd = pidof hyprlock || hyprlock       # Avoid starting multiple instances
    before_sleep_cmd = loginctl lock-session    # Lock before suspend
    after_sleep_cmd = niri msg action power-on-monitors
}

# 1. Warning T seconds before hyprlock (At N - T seconds)
listener {
    timeout = 270                               # Example: N=300 (5m), T=30 (30s) -> 270s
    on-timeout = notify-send -a "hypridle" -u critical -t 5000 "Screen Locking" "Locking screen in 30 seconds..." -i display
    on-resume = notify-send -a "hypridle" -u low "Lock Cancelled" "Activity detected, timer reset." -i display
}

# 2. Fire hyprlock (At N seconds)
listener {
    timeout = 300                               # N seconds
    on-timeout = loginctl lock-session
}

# 3. Turn off screens while locked (At N + M seconds)
listener {
    timeout = 600                               # Example: N=300, M=300 (5m after lock) -> 600s total
    on-timeout = niri msg action power-off-monitors
    on-resume = niri msg action power-on-monitors
}
