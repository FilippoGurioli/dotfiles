$font = FiraCode Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    contrast = 0.8
    brightness = 0.8
}

# --- CLOCK (Top Center) ---
label {
    monitor = DP-1
    text = $TIME
    font_size = 90
    font_family = $font
    color = rgba(255, 255, 255, 0.9)
    position = 0, -100
    halign = center
    valign = top
}

# --- DATE (Below Clock) ---
label {
    monitor = DP-1
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 22
    font_family = $font
    color = rgba(255, 255, 255, 0.7)
    position = 0, -220
    halign = center
    valign = top
}

# --- AVATAR (Center) ---
image {
    monitor = DP-1
    path = $HOME/.face
    size = 120
    border_size = 3
    border_color = rgba(255, 255, 255, 0.5)
    position = 0, 100
    halign = center
    valign = center
}   

# --- USER GREETING ---
label {
    monitor = DP-1
    text = Are you $USER?
    font_size = 45
    font_family = $font
    color = rgba(255, 255, 255, 0.9)
    position = 0, 20
    halign = center
    valign = center
}

# --- PASSWORD INPUT ---
input-field {
    monitor = DP-1
    size = 20%, 5%
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.3)
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    rounding = 15
    font_family = $font
    placeholder_text = Prove it.
    fail_text = <i>$PAMFAIL</i>
    position = 0, -80
    halign = center
    valign = center
}
